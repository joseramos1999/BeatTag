name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Para poder lanzarlo a mano mientras se trabaja en el port a macOS.
  workflow_dispatch:

# Solo lectura: compilar y probar ejecuta código de paquetes de terceros, que no tiene por qué
# poder escribir en el repositorio. Las acciones van fijadas por commit, con su versión al lado.
permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}
    # Las dos plataformas son bloqueantes.
    #
    # macOS lo es desde que compila, pasa los 547 tests y produce el ejecutable para Apple Silicon.
    # Eso NO significa que el port esté terminado: quedan seis piezas -DPAPI, la decodificación de
    # audio, la reproducción, la papelera, winget y fpcalc- que no se rompen al compilar ni en los
    # tests, solo al USARLAS. Lo que este trabajo protege es que lo ya conseguido no se pierda por
    # un descuido, que es justo para lo que sirve una CI.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: Windows
          - os: macos-latest
            nombre: macOS

    defaults:
      run:
        working-directory: EtiquetadorNet

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup .NET 9
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # Los tests que fallen se publican ademas como ANOTACIONES del run. Los logs completos exigen
      # permisos de administrador para leerse, y las anotaciones no: asi el resultado de macOS se
      # puede consultar desde fuera sin tener que entrar a mirarlo a mano cada vez.
      #
      # --blame-hang-timeout: una prueba que se queda colgada se corta a los 10 minutos y se dice
      # cuál era. Visto en octubre de 2026: en macOS el paso se quedaba colgado de vez en cuando y a
      # los 46 minutos GitHub daba el equipo por perdido, sin ningún dato de qué prueba lo causaba.
      - name: Test
        shell: bash
        timeout-minutes: 25
        run: |
          if dotnet test -c Release --no-build --verbosity normal --blame-hang-timeout 10m --blame-hang-dump-type none > test.log 2>&1; then
            tail -3 test.log
          else
            echo "::group::Salida completa"; cat test.log; echo "::endgroup::"

            # UNA sola anotacion con todo dentro: GitHub solo conserva unas diez por trabajo y
            # ademas deduplica, asi que emitir una por fallo perdia justo lo que hace falta ver.
            # %0A es el salto de linea dentro de un mensaje de anotacion. Incluye las pruebas que
            # estaban en marcha cuando --blame-hang-timeout cortó la ejecución.
            fallos=$( { grep -E "^[[:space:]]*(Failed|Con error) [A-Za-z]" test.log; grep -iE -A6 "hang|were running|se estaban ejecutando|aborted|anul" test.log; } | sed 's/^[[:space:]]*//' | sort -u)
            total=$(printf '%s\n' "$fallos" | grep -c . || true)
            cuerpo=$(printf '%s\n' "$fallos" | head -60 | awk '{printf "%s%%0A", $0}')
            echo "::error title=Tests que fallan ($total)::$cuerpo"
            exit 1
          fi

      # Solo en macOS: comprobar que además se puede PUBLICAR para Apple Silicon. Compilar y pasar
      # las pruebas no garantiza que el empaquetado salga; es un paso aparte y conviene verlo fallar
      # por separado.
      # Monta el BeatTag.app universal (arm64 + Intel). El mismo script que usa la publicación de
      # una versión, para que lo que se prueba aquí y lo que se entrega sean exactamente lo mismo.
      - name: Montar BeatTag.app
        if: matrix.os == 'macos-latest'
        shell: bash
        run: ../scripts/empaquetar-macos.sh

      - name: Guardar el resultado de macOS
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BeatTag-macos-universal
          path: BeatTag-macos-universal.tar.gz
          if-no-files-found: error

name: Diagnóstico macOS (temporal)

# TEMPORAL: se quita antes de unir la rama.
#
# Causa encontrada y reproducida: Process.Kill(entireProcessTree: true) para los procesos con
# SIGSTOP, y con el grupo de procesos huérfano el núcleo manda SIGHUP a todo el grupo, que es también
# el del runner. La aplicación ya mata sin parar a nadie (Procesos.Matar).
#
# Comprobación: las mismas pruebas que la CI, sin más cambios, en siete equipos por vuelta. Antes
# moría el runner en uno de cada ocho equipos.
on:
  push:
    branches: [ claude/ci-macos-cuelgue ]

permissions:
  contents: read

jobs:
  pruebas:
    name: comprobación ${{ matrix.intento }}
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        intento: [ 1, 2, 3, 4, 5, 6, 7 ]
    defaults:
      run:
        working-directory: EtiquetadorNet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Test
        shell: bash
        timeout-minutes: 8
        run: ../scripts/pruebas-vigiladas.sh

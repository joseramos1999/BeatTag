name: Diagnóstico macOS (temporal)

# TEMPORAL: se quita antes de unir la rama.
#
# Con las pruebas, uno de cada cinco o seis equipos macOS 26 se para entero a los pocos segundos,
# sin quedarse sin memoria ni disco (descartado también el vaciado a disco: dos minutos de
# F_FULLFSYNC sin parar no colgaron ninguno). Esta vuelta mira dos cosas:
#   - macOS 26 con un límite de 8 minutos para el TRABAJO: si GitHub lo corta aunque el equipo no
#     responda, un cuelgue cuesta 8 minutos y no 46;
#   - las mismas pruebas en macOS 15, por si el cuelgue es cosa del sistema.
on:
  push:
    branches: [ claude/ci-macos-cuelgue ]

permissions:
  contents: read

jobs:
  pruebas:
    name: ${{ matrix.so }} ${{ matrix.intento }}
    runs-on: ${{ matrix.so }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - { so: macos-latest, intento: 1 }
          - { so: macos-latest, intento: 2 }
          - { so: macos-latest, intento: 3 }
          - { so: macos-latest, intento: 4 }
          - { so: macos-latest, intento: 5 }
          - { so: macos-15, intento: 1 }
          - { so: macos-15, intento: 2 }
    defaults:
      run:
        working-directory: EtiquetadorNet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Test
        shell: bash
        timeout-minutes: 6
        run: ../scripts/pruebas-vigiladas.sh

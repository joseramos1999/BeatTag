name: Diagnóstico macOS (temporal)

# TEMPORAL: se quita antes de unir la rama.
#
# Con las pruebas, uno de cada cinco o seis equipos macOS se paraba entero a los pocos segundos, sin
# quedarse sin memoria ni disco. La sospecha: el vaciado a disco de .NET (Flush(true)), que en macOS
# es fcntl(F_FULLFSYNC) y obliga al disco del equipo virtual a vaciarse de verdad; el historial de
# deshacer lo hace en cada anotación y llegó el 19 de octubre, justo antes del primer cuelgue.
#
# Esto lo comprueba sin nada de la aplicación: varios hilos que escriben y vacían a disco sin parar,
# con F_FULLFSYNC y, de control, con fsync normal. Si es eso, se cuelgan los primeros.
on:
  push:
    branches: [ claude/ci-macos-cuelgue ]

permissions:
  contents: read

jobs:
  vaciado:
    name: ${{ matrix.modo }} ${{ matrix.intento }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        modo: [ full ]
        intento: [ 1, 2, 3, 4 ]
        include:
          - { modo: normal, intento: 1 }
          - { modo: normal, intento: 2 }
    steps:
      - name: Pruebas de vaciado a disco
        shell: bash
        timeout-minutes: 10
        run: |
          cat > "$RUNNER_TEMP/vaciado.py" <<'EOF'
          import fcntl, os, sys, threading, time
          modo, hilos, segundos = sys.argv[1], int(sys.argv[2]), float(sys.argv[3])
          cuenta, peor = [0] * hilos, [0.0] * hilos
          def trabajo(i):
              ruta = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), f"vaciado_{i}.bin")
              fin = time.time() + segundos
              with open(ruta, "wb") as f:
                  while time.time() < fin:
                      f.seek(0); f.write(os.urandom(4096)); f.flush()
                      t = time.time()
                      if modo == "full": fcntl.fcntl(f.fileno(), fcntl.F_FULLFSYNC)
                      else: os.fsync(f.fileno())
                      peor[i] = max(peor[i], time.time() - t); cuenta[i] += 1
          hs = [threading.Thread(target=trabajo, args=(i,)) for i in range(hilos)]
          for h in hs: h.start()
          inicio = time.time()
          while any(h.is_alive() for h in hs):
              time.sleep(1)
              print(f"{time.time() - inicio:.0f} s · {sum(cuenta)} vaciados · el más lento {max(peor) * 1000:.0f} ms", flush=True)
          EOF
          python3 "$RUNNER_TEMP/vaciado.py" "${{ matrix.modo }}" 6 120

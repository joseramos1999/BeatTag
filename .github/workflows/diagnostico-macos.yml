name: Diagnóstico macOS (temporal)

# TEMPORAL: se quita antes de unir la rama.
#
# Con las pruebas, uno de cada ocho equipos macOS recién arrancados se para entero a los pocos
# segundos, en macOS 26 y en macOS 15. En los dos cuelgues en que se vio qué pruebas estaban en
# marcha se repetía HuellasDuplicadosTests.Varias_consultas_a_la_vez_esperan_a_la_misma_lectura. Sin
# ella, 0 cuelgues en 9 equipos; con ella, 1 en 6. Pocos para fiarse: esta vuelta corre SIN ella en
# los siete equipos, con el vigilante, para juntar suficientes equipos recién arrancados.
on:
  push:
    branches: [ claude/ci-macos-cuelgue ]

permissions:
  contents: read

jobs:
  pruebas:
    name: sin-ella ${{ matrix.intento }}
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        intento: [ 1, 2, 3, 4, 5, 6, 7 ]
    defaults:
      run:
        working-directory: EtiquetadorNet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Test
        shell: bash
        timeout-minutes: 8
        env:
          FILTRO_PRUEBAS: FullyQualifiedName!=Etiquetador.Tests.HuellasDuplicadosTests.Varias_consultas_a_la_vez_esperan_a_la_misma_lectura
        run: ../scripts/pruebas-vigiladas.sh
